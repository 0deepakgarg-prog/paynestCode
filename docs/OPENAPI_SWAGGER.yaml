openapi: 3.0.3
info:
  title: PayNest API
  version: "1.0.0"
  description: >
    Swagger-style OpenAPI document for PayNest wallet, account, pricing,
    payment, tag, FX, transaction history, and receipt APIs.
servers:
  - url: http://localhost:8080
    description: Local server
tags:
  - name: Authentication
  - name: Accounts
  - name: Wallets
  - name: Payments
  - name: Transactions
  - name: Pricing
  - name: Tags
  - name: FX Rates
  - name: Receipts
  - name: Internal

security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login by identifier and credential
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/challenge-token:
    get:
      tags: [Authentication]
      summary: Generate challenge token for authenticated account
      responses:
        "200":
          description: Challenge token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeTokenResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/register/selfGenOtp:
    post:
      tags: [Accounts]
      summary: Generate OTP for self registration
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "200":
          description: OTP generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/register/selfWithOtp:
    post:
      tags: [Accounts]
      summary: Complete self registration using OTP
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequestWithOtp"
      responses:
        "200":
          description: Account registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/registerUser:
    post:
      tags: [Accounts]
      summary: Register admin or business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "200":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/pin/changeDefault:
    post:
      tags: [Accounts]
      summary: Change default PIN
      requestBody:
        $ref: "#/components/requestBodies/ChangePin"
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/pin/change:
    post:
      tags: [Accounts]
      summary: Change PIN
      requestBody:
        $ref: "#/components/requestBodies/ChangePin"
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/password/changeDefault:
    post:
      tags: [Accounts]
      summary: Change default password
      requestBody:
        $ref: "#/components/requestBodies/ChangePassword"
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/password/change:
    post:
      tags: [Accounts]
      summary: Change password
      requestBody:
        $ref: "#/components/requestBodies/ChangePassword"
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/updateSelf:
    put:
      tags: [Accounts]
      summary: Update authenticated account profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/addKyc:
    post:
      tags: [Accounts]
      summary: Add KYC document to account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAccountKycRequest"
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/getAccountDetails/{accountId}:
    get:
      tags: [Accounts]
      summary: Get account, identifiers, and KYC details
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      accountDetails:
                        $ref: "#/components/schemas/AccountKycDetailsResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/{accountId}/suspend:
    post:
      tags: [Accounts]
      summary: Suspend an account
      description: Admin-only operation. Suspended users can login and view only their own wallet balance.
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
      requestBody:
        $ref: "#/components/requestBodies/AccountStatusChange"
      responses:
        "200":
          description: Account suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatusApiResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/{accountId}/resume:
    post:
      tags: [Accounts]
      summary: Resume a suspended account
      description: Admin-only operation. Changes account status back to ACTIVE.
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
      requestBody:
        $ref: "#/components/requestBodies/AccountStatusChange"
      responses:
        "200":
          description: Account resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatusApiResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/{accountId}/status-history:
    get:
      tags: [Accounts]
      summary: Get account status history
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
      responses:
        "200":
          description: Status history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      statusHistory:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccountStatusHistory"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/account/subscriber/{accountId}:
    delete:
      tags: [Accounts]
      summary: Delete subscriber account
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/wallet/getAccountWallets/{accountId}:
    get:
      tags: [Wallets]
      summary: Get wallets and balances for account
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
      responses:
        "200":
          description: Wallet list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      wallets:
                        $ref: "#/components/schemas/AccountWalletsResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/wallet/restrictions:
    post:
      tags: [Wallets]
      summary: Create wallet restriction
      requestBody:
        $ref: "#/components/requestBodies/WalletRestriction"
      responses:
        "200":
          description: Restriction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletRestrictionApiResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/wallet/restrictions/{walletId}:
    get:
      tags: [Wallets]
      summary: Get wallet restriction
      parameters:
        - $ref: "#/components/parameters/WalletIdPath"
      responses:
        "200":
          description: Restriction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletRestrictionApiResponse"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Wallets]
      summary: Update wallet restriction
      parameters:
        - $ref: "#/components/parameters/WalletIdPath"
      requestBody:
        $ref: "#/components/requestBodies/WalletRestriction"
      responses:
        "200":
          description: Restriction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletRestrictionApiResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/wallet/restrictions/{walletId}/history:
    get:
      tags: [Wallets]
      summary: Get wallet restriction history
      parameters:
        - $ref: "#/components/parameters/WalletIdPath"
      responses:
        "200":
          description: Restriction history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      history:
                        type: array
                        items:
                          $ref: "#/components/schemas/WalletRestrictionHistoryResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/U2U:
    post:
      tags: [Payments]
      summary: User-to-user wallet transfer
      requestBody:
        $ref: "#/components/requestBodies/CommonPayment"
      responses:
        "200":
          description: U2U transfer result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/U2UPaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/calculatePricing:
    post:
      tags: [Payments, Pricing]
      summary: Calculate pricing for a payment request
      requestBody:
        $ref: "#/components/requestBodies/CommonPayment"
      responses:
        "200":
          description: Pricing computation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      pricing:
                        $ref: "#/components/schemas/PricingComputationResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/INTRAWALLET:
    post:
      tags: [Payments]
      summary: Transfer between wallets of same account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntraWalletTransferRequest"
      responses:
        "200":
          description: Intra-wallet transfer result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntraWalletTransferResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/MERCHANTPAY:
    post:
      tags: [Payments]
      summary: Merchant payment
      requestBody:
        $ref: "#/components/requestBodies/CommonPayment"
      responses:
        "200":
          description: Merchant payment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasePaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/CASHIN:
    post:
      tags: [Payments]
      summary: Cash-in transaction
      requestBody:
        $ref: "#/components/requestBodies/CommonPayment"
      responses:
        "200":
          description: Cash-in result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasePaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/CASHOUT:
    post:
      tags: [Payments]
      summary: Cash-out transaction
      requestBody:
        $ref: "#/components/requestBodies/CommonPayment"
      responses:
        "200":
          description: Cash-out result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasePaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/BILLPAY:
    post:
      tags: [Payments]
      summary: Bill payment
      requestBody:
        $ref: "#/components/requestBodies/CommonPayment"
      responses:
        "200":
          description: Bill payment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillPayPaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/o2c/initiate:
    post:
      tags: [Payments]
      summary: Initiate operator-to-channel transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/O2CPaymentRequest"
      responses:
        "200":
          description: O2C initiation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasePaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/o2c/status:
    post:
      tags: [Payments]
      summary: Update O2C status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: O2C status update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasePaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/stockInitiate:
    post:
      tags: [Payments]
      summary: Initiate stock creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockInitiateRequest"
      responses:
        "200":
          description: Stock initiation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasePaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/stockStatusUpdate:
    post:
      tags: [Payments]
      summary: Update stock creation status
      requestBody:
        $ref: "#/components/requestBodies/StockApproval"
      responses:
        "200":
          description: Stock status update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasePaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/stockReimbursementInitiate:
    post:
      tags: [Payments]
      summary: Initiate stock reimbursement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockReimbursementInitiateRequest"
      responses:
        "200":
          description: Stock reimbursement initiation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasePaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pay/stockReimbursementStatusUpdate:
    post:
      tags: [Payments]
      summary: Update stock reimbursement status
      requestBody:
        $ref: "#/components/requestBodies/StockApproval"
      responses:
        "200":
          description: Stock reimbursement status update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasePaymentResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/internal/settletxn:
    post:
      tags: [Internal]
      summary: Settle pending transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleTransactionRequest"
      responses:
        "200":
          description: Settlement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleTransactionResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transaction/{accountId}/{transactionId}:
    get:
      tags: [Transactions]
      summary: Get transaction details for account
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDetailResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/transaction/history:
    get:
      tags: [Transactions]
      summary: Get payment history
      parameters:
        - $ref: "#/components/parameters/HistoryAccountId"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PaymentMethodType"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentHistoryResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/payment/history:
    get:
      tags: [Transactions]
      summary: Get payment history alias
      parameters:
        - $ref: "#/components/parameters/HistoryAccountId"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PaymentMethodType"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentHistoryResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pricing:
    post:
      tags: [Pricing]
      summary: Create pricing rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricingRuleRequest"
            examples:
              flatServiceChargeAllTags:
                value:
                  pricingName: E2E tag service charge P2P
                  serviceCode: U2U
                  ruleType: SERVICE_CHARGE
                  pricingType: STATIC
                  payer: SENDER
                  senderTagKey: ALLTAGS
                  receiverTagKey: ALLTAGS
                  currency: USD
                  pricingConfig:
                    basedOn: TXNAMOUNT
                    charging_strategy: FLAT
                    calc:
                      type: FLAT
                      value: 1.00
                  status: ACTIVE
      responses:
        "200":
          description: Pricing rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRuleApiResponse"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [Pricing]
      summary: Get all pricing rules
      responses:
        "200":
          description: Pricing rules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      pricingRules:
                        type: array
                        items:
                          $ref: "#/components/schemas/PricingRuleResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pricing/{id}:
    get:
      tags: [Pricing]
      summary: Get pricing rule by id
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Pricing rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRuleApiResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Pricing]
      summary: Update pricing rule
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePricingRuleRequest"
      responses:
        "200":
          description: Pricing rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRuleApiResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/pricing/{id}/status:
    patch:
      tags: [Pricing]
      summary: Update pricing rule status
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/PricingStatus"
      responses:
        "200":
          description: Pricing rule status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRuleApiResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/tags:
    get:
      tags: [Tags]
      summary: Get all tags
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      tags:
                        type: array
                        items:
                          $ref: "#/components/schemas/TagResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Tags]
      summary: Create tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTagRequest"
      responses:
        "200":
          description: Tag created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      tag:
                        $ref: "#/components/schemas/TagResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/tags/accounts/{accountId}:
    get:
      tags: [Tags]
      summary: Get tags for account
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
      responses:
        "200":
          description: Account tags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      accountTags:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccountTagResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/tags/categories:
    get:
      tags: [Tags]
      summary: Get tag categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      categories:
                        type: array
                        items:
                          $ref: "#/components/schemas/CategoryResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/tags/types:
    get:
      tags: [Tags]
      summary: Get tag types
      responses:
        "200":
          description: Tag types
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      tagTypes:
                        type: array
                        items:
                          $ref: "#/components/schemas/TagTypeResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/tags/{tagId}:
    delete:
      tags: [Tags]
      summary: Delete tag
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/tags/{tagId}/accounts:
    get:
      tags: [Tags]
      summary: Get accounts linked to tag
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Tag accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      tagAccounts:
                        type: array
                        items:
                          $ref: "#/components/schemas/TagAccountResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/tags/{tagId}/accounts/{accountId}:
    post:
      tags: [Tags]
      summary: Link tag to account
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/AccountIdPath"
      responses:
        "200":
          description: Tag linked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      accountTag:
                        $ref: "#/components/schemas/UserTagResponse"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Tags]
      summary: Unlink tag from account
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/AccountIdPath"
      responses:
        "200":
          $ref: "#/components/responses/SimpleSuccess"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/fx-rates:
    post:
      tags: [FX Rates]
      summary: Create FX rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFxRateRequest"
      responses:
        "200":
          description: FX rate created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      fxRate:
                        $ref: "#/components/schemas/FxRateResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/download/receipt:
    get:
      tags: [Receipts]
      summary: Download transaction receipt PDF
      parameters:
        - name: transactionId
          in: query
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: accountId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: PDF receipt
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id

  parameters:
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    WalletIdPath:
      name: walletId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    HistoryAccountId:
      name: accountId
      in: query
      required: false
      schema:
        type: string
    FromDate:
      name: fromDate
      in: query
      required: false
      schema:
        type: string
    ToDate:
      name: toDate
      in: query
      required: false
      schema:
        type: string
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    PaymentMethodType:
      name: paymentMethodType
      in: query
      required: false
      schema:
        type: string
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [ASC, DESC]
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string

  requestBodies:
    ChangePin:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChangePinRequest"
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChangePasswordRequest"
    AccountStatusChange:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountStatusChangeRequest"
    WalletRestriction:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WalletRestrictionRequest"
    CommonPayment:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommonPaymentRequest"
    StockApproval:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StockApprovalRequest"

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    SimpleSuccess:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: SUCCESS
              message:
                type: string

  schemas:
    ApiResponse:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        code:
          type: string
          nullable: true
        message:
          type: string
      additionalProperties: true

    ApiErrorResponse:
      type: object
      properties:
        responseStatus:
          $ref: "#/components/schemas/TransactionStatus"
        code:
          type: string
          example: INVALID_TOKEN
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        success:
          type: boolean
          example: false
        errorCode:
          type: string
        errorMessage:
          type: string

    IdentifierType:
      type: string
      enum: [ACCOUNT_ID, MOBILE, MSISDN, LOGINID]
    AuthType:
      type: string
      enum: [PIN, PASSWORD, OTP]
    RequestGateway:
      type: string
      enum: [MOBILE, WEB]
    InitiatedBy:
      type: string
      enum: [DEBITOR, CREDITOR]
    TransactionStatus:
      type: string
      enum: [SUCCESS, FAILURE, PENDING]
    BillPaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED]
    UserAccountType:
      type: string
      enum: [SUBSCRIBER, MERCHANT, ADMIN, AGENT]
    PaymentAccountType:
      type: string
      enum: [SUBSCRIBER, MERCHANT, AGENT, BILLER, BUSINESS]
    Gender:
      type: string
      enum: [MALE, FEMALE, OTHER]
    WalletType:
      type: string
      description: Enum-backed values are MAIN, BONUS, SALARY; DB may also contain system wallet types such as BANK, SC, COMMDIS, TAX.
      enum: [MAIN, BONUS, SALARY, BANK, SC, COMMDIS, TAX]
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, BLOCKED, LOCKED, SUSPENDED]
    PricingRuleType:
      type: string
      enum: [SERVICE_CHARGE, COMMISSION, DISCOUNT, CASHBACK]
    PricingType:
      type: string
      description: Current service validator accepts STATIC and CAMPAIGN. ALLTAGS is used as a tag key, not pricingType.
      enum: [STATIC, CAMPAIGN]
    PricingPayer:
      type: string
      enum: [SENDER, RECEIVER, SYSTEM, SPLIT]
    PricingPayBy:
      type: string
      enum: [SYSTEM, SENDER, RECEIVER]
    PricingStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    AuthLoginRequest:
      type: object
      required: [requestId, user, authFactor]
